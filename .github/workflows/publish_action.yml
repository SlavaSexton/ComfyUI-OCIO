name: Publish to Comfy registry

# Publishes to the Comfy Registry, which is what ComfyUI-Manager reads.
#
# Designed to fire on two things: a manual run, and a push to main that touches pyproject.toml, so that
# bumping the version IS the publish and no API key is ever typed into a console or left in a shell history.
# The key lives once, as the repository secret REGISTRY_ACCESS_TOKEN, and nothing here can read it back out.
# THE PUSH TRIGGER IS CURRENTLY OFF - see the PAUSED note above the `on:` block for why and how to restore it.
#
# If this fails with an authentication error, the secret is missing or was rotated; create it again at
# Settings -> Secrets and variables -> Actions. If it fails with a duplicate-version error, the version in
# pyproject.toml was already published - bump it, the Registry will not take the same number twice.

# PAUSED 2026-08-10: the push trigger below is commented out on purpose. Versions 1.2.3 and 1.2.4 are both
# sitting Flagged in the Registry on false positives from its automated scan, and the scan reads the SOURCE,
# not the version - so publishing another number would only add a third flagged row without changing the
# outcome. Until the review clears, a version bump must NOT publish by itself; a manual run is still
# available through workflow_dispatch. Restore by uncommenting the four lines.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "pyproject.toml"

jobs:
  publish-node:
    name: Publish custom node to the registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
