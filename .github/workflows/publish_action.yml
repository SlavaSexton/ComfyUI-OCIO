name: Publish to Comfy registry

# Publishes to the Comfy Registry, which is what ComfyUI-Manager reads.
#
# Fires on two things: a manual run, and a push to main that touches pyproject.toml. The second is the point
# of it - the version number lives in pyproject.toml, so bumping the version IS the publish, and no API key
# is ever typed into a console or left in a shell history. The key lives once, as the repository secret
# REGISTRY_ACCESS_TOKEN, and nothing here can read it back out.
#
# If this fails with an authentication error, the secret is missing or was rotated; create it again at
# Settings -> Secrets and variables -> Actions. If it fails with a duplicate-version error, the version in
# pyproject.toml was already published - bump it, the Registry will not take the same number twice.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish custom node to the registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
