[project]
name = "comfyui-ocio"
description = "Nuke-style OpenColorIO color nodes for ComfyUI. Read a still/sequence/video, grade in ACES, write EXR/TIFF/PNG/JPEG or ProRes/DNxHR/h264/hevc - fully color-managed, now on ComfyUI's native VIDEO wire. Nine nodes: Read, Write, Player, ColorSpace, LogConvert, Display, CDLTransform, FileTransform, LookTransform."
version = "1.2.6"
# Both forms are valid per the Registry spec, but the site renders this field raw: { file = ... } shows up
# as the literal dict. The LICENSE file ships in the archive either way, so the readable form loses nothing.
# 2026-08-08: MIT -> Apache-2.0. The Registry shows whatever the LAST PUBLISHED version declared, so this
# line only reaches users on the next publish; GitHub picks the change up from LICENSE immediately.
license = { text = "Apache License 2.0" }
requires-python = ">=3.9"
dependencies = [
    "opencolorio>=2.2",
    "opencv-python-headless",
    # OpenCV's EXR codec is disabled unless OPENCV_IO_ENABLE_OPENEXR=1 is set before cv2 is imported,
    # which no ComfyUI launcher does - so EXR writes need their own backend (3.3 brought the File API).
    "OpenEXR>=3.3",
    "tifffile",
    "Pillow",
    "numpy",
]

[project.urls]
Repository = "https://github.com/SlavaSexton/ComfyUI-OCIO"

[tool.comfy]
PublisherId = "slavasexton"
DisplayName = "ComfyUI-OCIO"
# Registry spec caps the icon at 800x400. cover.png is 2560x1440, so it needs its own file.
Icon = "https://raw.githubusercontent.com/SlavaSexton/ComfyUI-OCIO/main/docs/assets/registry_icon.png"
includes = []
