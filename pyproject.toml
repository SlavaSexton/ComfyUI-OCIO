[project]
name = "comfyui-ocio"
description = "Nuke-style OpenColorIO color nodes for ComfyUI. Read a still/sequence/video, grade in ACES, decode a generative model's latent without the 0..1 clamp, write EXR/TIFF/PNG/JPEG or ProRes/DNxHR/h264/hevc - fully color-managed, on ComfyUI's native VIDEO wire. Thirteen nodes: Read, Write, Player, ColorSpace, LogConvert, Exposure, Display, CDLTransform, FileTransform, LookTransform, Clip Repair, VAE Decode, VAE Encode."
version = "1.3.2"
# Both forms are valid per the Registry spec, but the site renders this field raw: { file = ... } shows up
# as the literal dict. The LICENSE file ships in the archive either way, so the readable form loses nothing.
# 2026-08-08: MIT -> Apache-2.0. The Registry shows whatever the LAST PUBLISHED version declared, so this
# line only reaches users on the next publish; GitHub picks the change up from LICENSE immediately.
license = { text = "Apache License 2.0" }
requires-python = ">=3.9"
dependencies = [
    "opencolorio>=2.2",
    "opencv-python-headless",
    # EXR needs a backend of its own, because cv2 cannot be relied on for it at either major version: on
    # OpenCV 4 the codec is present but gated on OPENCV_IO_ENABLE_OPENEXR being set before cv2 is imported,
    # which no ComfyUI launcher does, and OpenCV 5 wheels drop it altogether (measured on 5.0.0.93:
    # getBuildInformation reports `OpenEXR: NO`). 3.3 is the floor because it brought the File API.
    "OpenEXR>=3.3",
    "tifffile",
    "Pillow",
    "numpy",
]

[project.urls]
Repository = "https://github.com/SlavaSexton/ComfyUI-OCIO"

[tool.comfy]
PublisherId = "slavasexton"
DisplayName = "ComfyUI-OCIO"
# Registry spec caps the icon at 800x400. cover.png is 2560x1440, so it needs its own file.
Icon = "https://raw.githubusercontent.com/SlavaSexton/ComfyUI-OCIO/main/docs/assets/registry_icon.png"
includes = []
